name: selfcheck

on:
  push:
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: |
          python -W error::SyntaxWarning -m py_compile \
            action_protocol.py action_runtime.py bot.py home_agent.py memory.py \
            selfcheck.py tools/action_replay.py tools/whale-relay.py voice.py
      - name: Offline selfcheck
        run: python selfcheck.py
      - name: Agent action replay
        run: python tools/action_replay.py
