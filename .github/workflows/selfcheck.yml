name: selfcheck

on:
  push:
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: |
          python -W error::SyntaxWarning -m compileall -q \
            bot.py whale scripts tools
      - name: Offline selfcheck
        run: python scripts/selfcheck.py
      - name: Agent action replay
        run: python tools/action_replay.py
      - name: Reliability checks
        run: python tools/reliability_check.py --json
